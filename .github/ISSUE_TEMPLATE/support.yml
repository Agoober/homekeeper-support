name: Get help
description: Ask a question or report a problem with HomeKeeper.
title: "[Help] "
labels: ["support"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reaching out! **This request is public** — please don't include personal information such as your address, policy or account numbers, or photos of documents.
        Check the [FAQ](https://agoober.github.io/homekeeper-support/) first; your answer may already be there.
  - type: textarea
    id: question
    attributes:
      label: What do you need help with?
      description: Describe the question or problem. For a problem, include what you expected and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce (for problems)
      placeholder: |
        1. Open Plan
        2. Tap …
  - type: input
    id: app-version
    attributes:
      label: HomeKeeper version
      description: Settings › About › Version
      placeholder: "1.0 (1)"
  - type: dropdown
    id: device
    attributes:
      label: Device
      options:
        - iPhone
        - iPad
        - Both
  - type: input
    id: ios-version
    attributes:
      label: iOS / iPadOS version
      description: iPhone Settings › General › About
      placeholder: "26.0"
